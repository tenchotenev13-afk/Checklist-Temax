<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
:root{
  --navy:#0D1B2A;--indigo:#2F54EB;--indigo-l:#EDF2FF;
  --green:#0A7C59;--green-l:#E6F9F1;
  --red:#C0392B;--red-l:#FDE8E8;
  --amber:#B45309;--amber-l:#FEF3C7;
  --slate:#64748B;--slate-l:#E2E8F0;--slate-xl:#F8FAFC;
  --white:#fff;--text:#0F172A;
  --r:10px;--sh:0 1px 8px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#EEF2F7;color:var(--text);min-height:100vh}
.topbar{background:var(--navy);position:sticky;top:0;z-index:200}
.topbar-stripe{height:3px;background:linear-gradient(90deg,#2F54EB,#0A7C59)}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-logo{height:34px;width:34px;border-radius:7px;object-fit:cover;flex-shrink:0}
.topbar-title{font-size:14px;font-weight:700;color:#fff}
.topbar-sub{font-size:10px;color:#64748B;margin-top:-1px}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-refresh{padding:6px 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s}
.btn-refresh:hover{background:rgba(255,255,255,.18)}
/* FILTER BAR */
.filter-bar{background:var(--white);border-bottom:1px solid var(--slate-l);padding:10px 16px;position:sticky;top:53px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-group{display:flex;flex-direction:column;gap:3px;min-width:120px;flex:1}
.filter-group label{font-size:10px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.05em}
.filter-select,.filter-input{padding:6px 9px;border:1.5px solid var(--slate-l);border-radius:6px;font-size:12px;font-family:inherit;color:var(--text);background:var(--slate-xl);width:100%}
.filter-select:focus,.filter-input:focus{outline:none;border-color:var(--indigo)}
.filter-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.filter-tag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--slate-l);background:var(--white);color:var(--slate);transition:all .12s;-webkit-tap-highlight-color:transparent}
.filter-tag.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.filter-tag.on-ok{background:var(--green);border-color:var(--green);color:#fff}
.filter-clear{padding:6px 12px;background:var(--slate-xl);border:1.5px solid var(--slate-l);border-radius:6px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;color:var(--slate);white-space:nowrap;transition:all .12s}
.filter-clear:hover{border-color:var(--red);color:var(--red)}
.filter-results{font-size:11px;color:var(--slate);padding:5px 0 0}
/* TABS */
.view-tabs{display:flex;background:var(--white);border-bottom:1px solid var(--slate-l);padding:0 16px;overflow-x:auto}
.view-tab{padding:9px 14px;font-size:12px;font-weight:600;color:var(--slate);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.view-tab.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.page{padding:12px 16px 60px}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:600px){.kpi-row{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--white);border-radius:var(--r);padding:12px;box-shadow:var(--sh);border-top:3px solid var(--slate-l)}
.kpi.ok{border-top-color:var(--green)}.kpi.warn{border-top-color:#D97706}.kpi.bad{border-top-color:var(--red)}.kpi.info{border-top-color:var(--indigo)}
.kpi-lbl{font-size:10px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.kpi-val{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700}
.kpi-sub{font-size:11px;color:var(--slate);margin-top:1px}
/* TABLE */
.data-table{width:100%;border-collapse:collapse;background:var(--white);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.data-table th{background:var(--navy);color:#94A3B8;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
.data-table th:hover{color:#fff}
.data-table th .sort-icon{margin-left:4px;opacity:.5}
.data-table th.sorted .sort-icon{opacity:1;color:var(--indigo)}
.data-table td{padding:9px 12px;font-size:12px;border-top:1px solid var(--slate-l);vertical-align:middle}
.data-table tr:hover td{background:var(--slate-xl)}
.data-table tr.row-ok td{background:#F0FDF9}
.data-table tr.row-warn td{background:#FFFBEB}
.data-table tr.row-bad td{background:#FFF5F5}
.td-mono{font-family:'JetBrains Mono',monospace;font-weight:600}
.td-note{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--slate)}
.td-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.b-ok{background:var(--green-l);color:var(--green)}.b-no{background:var(--red-l);color:var(--red)}.b-warn{background:var(--amber-l);color:var(--amber)}
/* HEATMAP */
.heatmap-wrap{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);overflow:auto;margin-bottom:12px}
.heatmap-table{border-collapse:collapse;min-width:100%}
.heatmap-table th{background:var(--navy);color:#94A3B8;font-size:10px;font-weight:700;padding:8px 10px;white-space:nowrap;text-align:center;position:sticky;top:0;z-index:1}
.heatmap-table th:first-child{text-align:left;position:sticky;left:0;z-index:2;background:var(--navy)}
.heatmap-table td{padding:7px 10px;font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:600;text-align:center;border:1px solid rgba(255,255,255,.1);white-space:nowrap}
.heatmap-table td:first-child{background:var(--navy);color:#fff;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;text-align:left;position:sticky;left:0;z-index:1;white-space:nowrap;padding:7px 12px}
.hm-great{background:#0A7C59;color:#fff}.hm-ok{background:#34D399;color:#065F46}.hm-warn{background:#FCD34D;color:#78350F}.hm-bad{background:#F87171;color:#7F1D1D}.hm-null{background:#F1F5F9;color:#94A3B8}
/* TREND */
.trend-card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.trend-title{font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.trend-bars{display:flex;gap:5px;align-items:flex-end;height:80px}
.tb-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:28px}
.tb-pct{font-size:9px;font-family:'JetBrains Mono',monospace;font-weight:700}
.tb-bar{width:100%;border-radius:3px 3px 0 0;min-height:3px}
.tb-label{font-size:8px;color:var(--slate);text-align:center;line-height:1.3}
/* NOTES */
.note-item{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--indigo)}
.note-item.has-repeat{border-left-color:var(--red)}
.note-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.note-shop{font-size:12px;font-weight:700;color:var(--text)}
.note-date{font-size:11px;color:var(--slate)}
.note-text{font-size:12px;color:var(--text);line-height:1.5;margin-bottom:4px}
.note-repeat{font-size:11px;color:var(--red);font-weight:600}
.note-deadline{font-size:11px;color:var(--amber);font-weight:600}
/* CHRONIC */
.chronic-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:7px;margin-bottom:6px;background:var(--red-l);border-left:3px solid var(--red)}
.chronic-name{flex:1;font-size:12px;line-height:1.4}
.chronic-cnt{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--red);white-space:nowrap}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px}
.spinner{width:32px;height:32px;border:3px solid rgba(47,84,235,.2);border-top-color:var(--indigo);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--slate);font-size:13px}
.error-box{background:var(--red-l);border:1px solid #FECACA;border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--red);margin:12px 0}
.section-title{font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.card-hdr{background:var(--navy);padding:9px 14px;font-size:11px;font-weight:700;color:#94A3B8;letter-spacing:.05em;text-transform:uppercase}
.formula-info{background:var(--indigo-l);border:1px solid #C5D4FB;border-radius:6px;padding:6px 12px;font-size:10px;color:var(--indigo);margin-bottom:10px;font-style:italic}
/* PDF */
.dash-pdf-btn{position:fixed;bottom:20px;right:20px;z-index:150;background:var(--navy);color:#fff;border:none;border-radius:50px;padding:10px 18px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;gap:6px;transition:all .15s}
.dash-pdf-btn:hover{background:var(--indigo);transform:translateY(-2px)}
@media(min-width:600px){.page{padding:16px 24px 60px}.filter-bar{padding:10px 24px}.view-tabs{padding:0 24px}}
@media print{body{background:#fff!important}.topbar,.filter-bar,.view-tabs,.btn-refresh,.dash-pdf-btn{display:none!important}.page{padding:0!important}@page{margin:12mm;size:A4 landscape}}

  s1:'Плочки',s2:'Строителство',s3:'Баня',s4:'Текстил',s5:'Подови настилки',
  s6:'Дом. потреби',s7:'Бои',s8:'Ел. машини',s9:'Градина',s10:'Градин. мебели',
  s11:'Крепежи',s12:'Входна зона',s13:'Вът. склад',s14:'Външ. склад',
  s15:'Плац',s16:'Касова зона',s17:'Осветление'
};

let allData=[], filtered=[], activeTab='overview', statusFilter='all', sortCol='date', sortDir=-1;


// ── PDF ОТЧЕТ ОТ ТАБЛОТО ─────────────────────────────────────────
function printByShopDate(shop, date) {
  try { shop = decodeURIComponent(shop); } catch(e) {}
  var d = filtered.find(function(e){ return e.shop === shop && String(e.date).slice(0,10) === String(date).slice(0,10); });
  if (!d) { alert('Данните не са намерени.'); return; }
  var idx = filtered.indexOf(d);
  printDashboardEntry(idx);
}

function printDashboardEntry(idx) {
  var d = filtered[idx];
  if (!d) return;

  var pctColor = function(p) {
    if (p === null || p === undefined) return '#94A3B8';
    return p >= 85 ? '#0A7C59' : p >= 60 ? '#D97706' : '#C0392B';
  };

  var sectorRows = '';
  SEC_IDS.forEach(function(sid) {
    var name = SEC_NAMES[sid];
    var p    = d.sectors    && d.sectors[sid]    !== null ? d.sectors[sid]    : null;
    var g    = d.sectorsGen  && d.sectorsGen[sid]  !== null ? d.sectorsGen[sid]  : null;
    var s    = d.sectorsSpec && d.sectorsSpec[sid] !== null ? d.sectorsSpec[sid] : null;
    var col  = pctColor(p);
    var bg   = p === null ? '#F8FAFC' : p >= 85 ? '#E6F9F1' : p >= 60 ? '#FEF3C7' : '#FDE8E8';
    sectorRows += '<tr style="background:' + bg + ';border-bottom:1px solid #E2E8F0">'
      + '<td style="padding:6px 10px;font-size:11px">' + name + '</td>'
      + '<td style="padding:6px 10px;font-size:11px;text-align:center;color:#64748B">' + (g !== null ? g + '%' : '—') + '</td>'
      + '<td style="padding:6px 10px;font-size:11px;text-align:center;color:#64748B">' + (s !== null ? s + '%' : '—') + '</td>'
      + '<td style="padding:6px 10px;font-size:12px;font-weight:700;text-align:center;color:' + col + '">' + (p !== null ? p + '%' : '—') + '</td>'
      + '<td style="padding:6px 10px;font-size:11px;color:#64748B">' + (p === null ? '—' : p >= 85 ? '✅ ОК' : p >= 60 ? '⚠ Внимание' : '❌ Слаб') + '</td>'
      + '</tr>';
  });

  var notesHtml = '';
  if (d.notes && d.notes !== '-' && d.notes !== '') {
    notesHtml += '<div style="font-size:10px;font-weight:700;color:#64748B;text-transform:uppercase;margin-bottom:5px">Забележки</div>'
      + '<div style="border:1px solid #e2e8f0;border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:12px;line-height:1.6;color:#374151">'
      + d.notes.split(' | ').join('<br>') + '</div>';
  }
  if (d.repeatIssues && d.repeatIssues !== '-' && d.repeatIssues !== '') {
    notesHtml += '<div style="font-size:10px;font-weight:700;color:#C0392B;text-transform:uppercase;margin-bottom:5px">🔁 Повторни грешки</div>'
      + '<div style="border:1px solid #FECACA;border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#C0392B">'
      + d.repeatIssues + '</div>';
  }
  if (d.deadlines && d.deadlines !== '-' && d.deadlines !== '') {
    notesHtml += '<div style="font-size:10px;font-weight:700;color:#B45309;text-transform:uppercase;margin-bottom:5px">⏰ Срокове и отговорници</div>'
      + '<div style="border:1px solid #FCD34D;border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#B45309">'
      + d.deadlines.split(' | ').join('<br>') + '</div>';
  }

  var bonusColor = d.bonusOk ? '#0A7C59' : '#C0392B';
  var op = d.overallPct;

  var pw = window.open('', '_blank');
  pw.document.write('<!DOCTYPE html><html lang="bg"><head><meta charset="UTF-8"><title>ТеМАХ — ' + d.shop + ' — ' + d.date + '</title>'
    + '<style>body{font-family:Arial,sans-serif;margin:0;padding:20px;color:#0F172A}table{width:100%;border-collapse:collapse}@page{margin:15mm;size:A4 portrait}</style></head><body>'
    + '<div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:3px solid #0D1B2A;margin-bottom:16px">'
    + '<div><div style="font-size:22px;font-weight:800;color:#0D1B2A">ТеМАХ — Контролна карта</div>'
    + '<div style="font-size:11px;color:#64748B;margin-top:2px">Табло на директора — PDF отчет</div></div>'
    + '<div style="text-align:right"><div style="font-size:30px;font-weight:800;color:' + bonusColor + '">' + (op !== null ? op + '%' : '—') + '</div>'
    + '<div style="font-size:13px;font-weight:700;color:' + bonusColor + '">' + (d.bonusOk ? '✅ БОНУС ОДОБРЕН' : '✗ БЕЗ БОНУС') + '</div></div></div>'
    + '<table style="margin-bottom:14px"><tr>'
    + '<td style="padding:6px 8px;background:#F8FAFC;border:1px solid #e2e8f0;width:33%"><div style="font-size:9px;font-weight:700;color:#64748B;text-transform:uppercase">Магазин</div><div style="font-size:14px;font-weight:700;margin-top:2px">' + d.shop + '</div></td>'
    + '<td style="padding:6px 8px;background:#F8FAFC;border:1px solid #e2e8f0;width:33%"><div style="font-size:9px;font-weight:700;color:#64748B;text-transform:uppercase">Дата</div><div style="font-size:14px;font-weight:700;margin-top:2px">' + fmtDate(d.date) + '</div></td>'
    + '<td style="padding:6px 8px;background:#F8FAFC;border:1px solid #e2e8f0;width:33%"><div style="font-size:9px;font-weight:700;color:#64748B;text-transform:uppercase">Управител</div><div style="font-size:14px;font-weight:700;margin-top:2px">' + (String(d.manager||'') || '—') + '</div></td>'
    + '</tr></table>'
    + '<div style="font-size:10px;font-weight:700;color:#64748B;text-transform:uppercase;margin-bottom:5px">Резултати по сектори</div>'
    + '<table style="border:1px solid #e2e8f0;overflow:hidden;margin-bottom:14px">'
    + '<thead><tr style="background:#0D1B2A">'
    + '<th style="padding:7px 10px;font-size:10px;color:#94A3B8;text-align:left;text-transform:uppercase">Сектор</th>'
    + '<th style="padding:7px 10px;font-size:10px;color:#94A3B8;text-align:center;text-transform:uppercase">Общи %</th>'
    + '<th style="padding:7px 10px;font-size:10px;color:#94A3B8;text-align:center;text-transform:uppercase">Специф. %</th>'
    + '<th style="padding:7px 10px;font-size:10px;color:#94A3B8;text-align:center;text-transform:uppercase">Обща %</th>'
    + '<th style="padding:7px 10px;font-size:10px;color:#94A3B8;text-align:left;text-transform:uppercase">Статус</th>'
    + '</tr></thead><tbody>' + sectorRows + '</tbody></table>'
    + (function(){
        if (!d.photos || !Object.keys(d.photos).length) return '';
        var sids = Object.keys(d.photos).filter(function(sid){ return d.photos[sid] && d.photos[sid].length; });
        if (!sids.length) return '';
        var ph = '<div style="font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px">📷 Снимки по сектори</div>';
        sids.forEach(function(sid){
          var name = SEC_NAMES[sid] || sid;
          ph += '<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:600;color:#374151;margin-bottom:4px">' + name + '</div>';
          ph += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
          d.photos[sid].forEach(function(url){
            ph += '<img src="' + url + '" style="width:140px;height:105px;object-fit:cover;border-radius:4px;border:1px solid #E2E8F0">';
          });
          ph += '</div></div>';
        });
        return ph;
      })()
    + notesHtml
    + '<div style="margin-top:20px;padding-top:8px;border-top:1px solid #e2e8f0;font-size:10px;color:#94A3B8;display:flex;justify-content:space-between">'
    + '<span>ТеМАХ · Контролна карта · Табло на директора</span>'
    + '<span>Генерирано: ' + new Date().toLocaleString("bg-BG") + '</span></div>'
    + '<div style="margin-top:12px;text-align:center;display:flex;gap:10px;justify-content:center">'
    + '<button onclick="window.print()" style="padding:10px 24px;background:#0D1B2A;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">🖨️ Печат / Запази PDF</button>'
    + '<button onclick="window.close()" style="padding:10px 24px;background:#E2E8F0;color:#374151;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">✕ Затвори</button>'
    + '</div>'
    + '<script>(function(){var imgs=document.getElementsByTagName("img");if(!imgs.length){setTimeout(function(){window.print()},500);return;}var loaded=0,total=imgs.length;var doPrint=function(){if(++loaded>=total)setTimeout(function(){window.print()},300);};for(var i=0;i<imgs.length;i++){if(imgs[i].complete)doPrint();else{imgs[i].onload=doPrint;imgs[i].onerror=doPrint;}}setTimeout(function(){window.print()},4000);})()<\/script></body></html>');
  pw.document.close();
}

function loadData() {
  document.getElementById('tabContent').innerHTML='<div class="loading"><div class="spinner"></div><div style="font-size:13px;color:var(--slate)">Зареждане…</div></div>';
  const old=document.getElementById('_jsonp'); if(old) old.remove();
  const cb='_cb'+Date.now();
  window[cb]=function(json){
    try {
      delete window[cb];
      const s=document.getElementById('_jsonp'); if(s) s.remove();
      if(json&&json.status==='ok'&&json.data){
        allData=json.data;
        const el=document.getElementById('lastUpd');
        if(el) el.textContent='Обновено: '+new Date().toLocaleTimeString('bg-BG')+' · '+allData.length+' проверки';
        buildShopFilter();
        applyFilters();
      } else {
        showError('Грешка от API: '+(json&&json.message||'неизвестна'));
      }
    } catch(e){
      showError('Грешка при визуализация: '+e.message);
      console.error(e);
    }
  };
  const s=document.createElement('script'); s.id='_jsonp';
  s.src=SHEETS_URL+'?action=getAll&callback='+cb;
  s.onerror=function(){
    showError('⚠ Apps Script не отговаря. Проверете дали деплоят е активен и достъпен за всички.');
  };
  document.head.appendChild(s);
}

function showError(msg){
  document.getElementById('tabContent').innerHTML='<div class="error-box">⚠ '+msg+'</div><div style="text-align:center;padding:10px"><button onclick="loadData()" style="padding:8px 16px;background:var(--indigo);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">Опитай отново</button></div>';
}

function buildShopFilter(){
  const shops=[...new Set(allData.map(d=>d.shop).filter(Boolean))].sort();
  const sel=document.getElementById('fShop');
  sel.innerHTML='<option value="">Всички магазини</option>';
  shops.forEach(s=>{sel.innerHTML+=`<option value="${s}">${s}</option>`;});
  const secSel=document.getElementById('fSector');
  secSel.innerHTML='<option value="">Всички сектори</option>';
  SEC_IDS.forEach(sid=>{secSel.innerHTML+=`<option value="${sid}">${SEC_NAMES[sid]}</option>`;});
}

function setStatusFilter(val){
  statusFilter=val;
  document.querySelectorAll('.filter-tag').forEach(t=>{t.className='filter-tag';});
  const map={all:'ftAll',bonus:'ftBonus',nobonus:'ftNoBonus',ok:'ftOk',warn:'ftWarn',bad:'ftBad',repeat:'ftRepeat',block:'ftBlock'};
  if(map[val]) document.getElementById(map[val]).className='filter-tag on';
  applyFilters();
}

function applyFilters(){
  const shop=document.getElementById('fShop').value;
  const sector=document.getElementById('fSector').value;
  const from=document.getElementById('fFrom').value;
  const to=document.getElementById('fTo').value;
  const search=document.getElementById('fSearch').value.toLowerCase().trim();

  filtered=allData.filter(d=>{
    if(!d||!d.shop) return false;
    if(shop&&d.shop!==shop) return false;
    if(from&&(d.date||'')<from) return false;
    if(to&&(d.date||'')>to) return false;
    if(search&&!matchSearch(d,search)) return false;
    const p=d.overallPct;
    if(statusFilter==='bonus'&&!d.bonusOk) return false;
    if(statusFilter==='nobonus'&&d.bonusOk) return false;
    if(statusFilter==='ok'&&(p===null||p<85)) return false;
    if(statusFilter==='warn'&&(p===null||p<60||p>=85)) return false;
    if(statusFilter==='bad'&&(p===null||p>=60)) return false;
    if(statusFilter==='repeat'&&!d.repeatIssues) return false;
    if(statusFilter==='block'&&!d.blockFail) return false;
    // Секторният филтър само влияе на изгледа (таблица/тенденция) — не филтрира редове
    return true;
  });

  document.getElementById('filterResults').textContent=filtered.length+' проверки от '+allData.length;
  renderTab(activeTab);
}

function matchSearch(d,q){
  return [d.shop,String(d.manager||''),d.notes,d.repeatIssues,d.deadlines].some(f=>f&&f.toLowerCase().includes(q));
}

function clearFilters(){
  document.getElementById('fShop').value='';
  document.getElementById('fSector').value='';
  document.getElementById('fFrom').value='';
  document.getElementById('fTo').value='';
  document.getElementById('fSearch').value='';
  statusFilter='all';
  document.querySelectorAll('.filter-tag').forEach(t=>t.className='filter-tag');
  document.getElementById('ftAll').className='filter-tag on';
  applyFilters();
}

function switchTab(name){
  activeTab=name;
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('tab-'+name).classList.add('on');
  renderTab(name);
}

function renderTab(name){
  if(name==='overview') renderOverview();
  else if(name==='table') renderTable();
  else if(name==='heatmap') renderHeatmap();
  else if(name==='trend') renderTrend();
  else if(name==='notes') renderNotes();
  else if(name==='chronic') renderChronic();
}

function renderOverview(){
  if(!filtered.length){document.getElementById('tabContent').innerHTML='<p class="empty">Няма данни за избраните филтри.</p>';return;}
  const total=filtered.length;
  const bonus=filtered.filter(d=>d.bonusOk).length;
  const fSec=document.getElementById('fSector').value;
  // При избран сектор — показваме оценката за него, не общата
  const avg=filtered.filter(d=>{
    if(fSec) return d.sectors && d.sectors[fSec]!==null && d.sectors[fSec]!==undefined;
    return d.overallPct!==null;
  });
  const avgPct=avg.length?Math.round(avg.reduce((a,d)=>fSec?a+d.sectors[fSec]:a+d.overallPct,0)/avg.length):null;
  const blocks=filtered.filter(d=>d.blockFail).length;
  const shops=[...new Set(filtered.map(d=>d.shop))].length;

  const shopMap={};
  filtered.forEach(d=>{if(!shopMap[d.shop]||d.date>shopMap[d.shop].date) shopMap[d.shop]=d;});
  const ranked=Object.values(shopMap).sort((a,b)=>(b.overallPct||0)-(a.overallPct||0));

  const ok_class=avgPct===null?'info':avgPct>=85?'ok':avgPct>=60?'warn':'bad';
  const avgLabel=fSec?'Среден '+SEC_NAMES[fSec]:'Средна оценка';
  const avgSub=fSec?'сектор '+SEC_NAMES[fSec]:'на всички сектори';
  let h='<div class="kpi-row">'
    +kpiCard('Проверки',total,filtered.length+' записа','info')
    +kpiCard('Магазини',shops,'уникални обекта','info')
    +kpiCard(avgLabel,avgPct!==null?avgPct+'%':'—',avgSub,ok_class)
    +kpiCard('Бонус',bonus+'/'+total,Math.round(bonus/total*100)+'% одобрени',bonus===total?'ok':'warn')
    +'</div>';

  if(blocks) h+='<div style="background:var(--red-l);border:1px solid #FECACA;border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--red);font-weight:600">⛔ '+blocks+' проверки с блокиращ критерий</div>';
  // Секторна лента при избран сектор
  if(fSec){
    const secData=filtered.map(d=>({shop:d.shop,date:d.date,pct:d.sectors&&d.sectors[fSec]!==null?d.sectors[fSec]:null})).filter(d=>d.pct!==null);
    const belowThreshold=secData.filter(d=>d.pct<85).length;
    h+='<div style="background:var(--indigo-l);border:1px solid #C5D4FB;border-radius:var(--r);padding:10px 14px;margin-bottom:12px">'
      +'<div style="font-size:11px;font-weight:700;color:var(--indigo);margin-bottom:6px">🔍 Избран сектор: '+SEC_NAMES[fSec]+'</div>'
      +'<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px">'
      +'<span>Средна оценка: <b style="color:'+pctColor(avgPct)+'">'+( avgPct!==null?avgPct+'%':'—')+'</b></span>'
      +'<span>Под 85%: <b style="color:var(--red)">'+belowThreshold+' магазина</b></span>'
      +'<span>С данни: <b>'+secData.length+'</b></span>'
      +'</div></div>';
  }

  h+='<div class="section-title">Класация по последна проверка</div><div class="card"><div class="card-hdr">Магазини — последен резултат</div>';
  ranked.forEach((d,i)=>{
    const p=d.overallPct;
    const cc=p===null?'':p>=85?'row-ok':p>=60?'row-warn':'row-bad';
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
    const bg=cc==='row-ok'?'background:#F0FDF9':cc==='row-warn'?'background:#FFFBEB':cc==='row-bad'?'background:#FFF5F5':'';
    h+='<div style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--slate-l);'+bg+'">'
      +'<span style="font-size:14px;width:28px;flex-shrink:0">'+medal+'</span>'
      +'<span style="flex:1;font-size:13px;font-weight:600">'+d.shop+'</span>'
      +'<span style="font-size:10px;color:var(--slate)">'+fmtDate(d.date)+'</span>'
      +'<span class="td-mono" style="min-width:44px;text-align:right;color:'+pctColor(p)+'">'+( p!==null?p+'%':'—')+'</span>'
      +'<span class="td-badge '+(d.bonusOk?'b-ok':'b-no')+'">'+( d.bonusOk?'✅':'✗')+'</span>'
      +'<button data-shop="'+String(d.shop||'').replace(/"/g,'&quot;')+'" data-date="'+String(d.date||'')+'" onclick="printByShopDate(this.dataset.shop,this.dataset.date)" style="padding:6px 14px;background:var(--indigo);border:none;border-radius:6px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0">📄 PDF</button>'
      +'</div>';
  });
  h+='</div>';
  document.getElementById('tabContent').innerHTML=h;
}

function kpiCard(lbl,val,sub,cls){return'<div class="kpi '+cls+'"><div class="kpi-lbl">'+lbl+'</div><div class="kpi-val">'+val+'</div><div class="kpi-sub">'+sub+'</div></div>';}

function renderTable(){
  if(!filtered.length){document.getElementById('tabContent').innerHTML='<p class="empty">Няма данни.</p>';return;}
  const fSec=document.getElementById('fSector').value;
  let h='<div style="overflow-x:auto"><table class="data-table"><thead><tr>'
    +thSort('date','Дата')+thSort('shop','Магазин')+thSort('manager','Управител')
    +thSort('overallPct','Обща %')+'<th>Бонус</th>'
    +(fSec?'<th>'+SEC_NAMES[fSec]+'</th>':'')
    +'<th>Блокиращ</th><th>Забележки</th><th>Повт. грешка</th><th>Срок/Отг.</th><th>Снимки</th>'
    +'</tr></thead><tbody>';

  const sorted=[...filtered].sort((a,b)=>{
    let av=a[sortCol],bv=b[sortCol];
    if(av===null||av===undefined) av='';
    if(bv===null||bv===undefined) bv='';
    return av<bv?sortDir:av>bv?-sortDir:0;
  });
  sorted.forEach(d=>{
    const p=d.overallPct;
    const rc=p===null?'':p>=85?'row-ok':p>=60?'row-warn':'row-bad';
    const sp=fSec&&d.sectors?d.sectors[fSec]:null;
    h+='<tr class="'+rc+'">'
      +'<td>'+fmtDate(d.date)+'</td>'
      +'<td style="font-weight:600">'+d.shop+'</td>'
      +'<td>'+( String(d.manager||'')||'—')+'</td>'
      +'<td class="td-mono" style="color:'+pctColor(p)+'">'+( p!==null?p+'%':'—')+'</td>'
      +'<td><span class="td-badge '+(d.bonusOk?'b-ok':'b-no')+'">'+( d.bonusOk?'✅':'✗')+'</span></td>'
      +(fSec?'<td class="td-mono" style="color:'+pctColor(sp)+'">'+( sp!==null?sp+'%':'—')+'</td>':'')
      +'<td><span class="td-badge '+(d.blockFail?'b-no':'b-ok')+'">'+( d.blockFail?'⛔ ДА':'ОК')+'</span></td>'
      +'<td class="td-note" title="'+(d.notes||'')+'">'+( d.notes&&d.notes!=='-'?d.notes:'—')+'</td>'
      +'<td>'+( d.repeatIssues&&d.repeatIssues!=='-'?'<span style="color:var(--red);font-weight:600">ДА</span>':'—')+'</td>'
      +'<td class="td-note" title="'+(d.deadlines||'')+'">'+( d.deadlines&&d.deadlines!=='-'?d.deadlines:'—')+'</td>'
      +'<td style="white-space:nowrap;font-size:11px">'+(function(){
        if(!d.photos||!Object.keys(d.photos).length) return '—';
        const sids=Object.keys(d.photos).filter(sid=>d.photos[sid]&&d.photos[sid].length);
        if(!sids.length) return '—';
        return sids.map(sid=>{
          const urls = d.photos[sid].join('|||');
          return '<a href="javascript:void(0)" onclick="showPhotoGallery(\''+urls.replace(/'/g,"\\'")+'\',\''+sid+'\')" style="color:#3B5BDB;text-decoration:none;cursor:pointer">📷'+sid.replace('s','')+'('+d.photos[sid].length+')</a>';
        }).join(' ');
      })()+' </td>'+
      '</tr>';
  });
  h+='</tbody></table></div>';
  document.getElementById('tabContent').innerHTML=h;
}


function showPhotoGallery(urlsStr, sid){
  const urls = urlsStr.split('|||');
  const secName = (typeof SEC_NAMES !== 'undefined' && SEC_NAMES[sid]) ? SEC_NAMES[sid] : sid;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;box-sizing:border-box';
  overlay.onclick = function(e){ if(e.target===overlay) document.body.removeChild(overlay); };

  const title = document.createElement('div');
  title.style.cssText = 'color:#fff;font-size:14px;font-weight:700;margin-bottom:16px';
  title.textContent = secName + ' — ' + urls.length + ' снимки';
  overlay.appendChild(title);

  const grid = document.createElement('div');
  grid.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;max-width:90vw;max-height:75vh;overflow:auto;justify-content:center';
  urls.forEach(function(u){
    const img = document.createElement('img');
    img.src = u;
    img.style.cssText = 'max-width:280px;max-height:280px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid #fff';
    img.onclick = function(e){ e.stopPropagation(); window.open(u, '_blank'); };
    grid.appendChild(img);
  });
  overlay.appendChild(grid);

  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕ Затвори';
  closeBtn.style.cssText = 'margin-top:16px;padding:8px 20px;background:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer';
  closeBtn.onclick = function(){ document.body.removeChild(overlay); };
  overlay.appendChild(closeBtn);

  document.body.appendChild(overlay);
}

function thSort(col,label){
  const on=sortCol===col;
  const icon=on?(sortDir===1?'▲':'▼'):'↕';
  return'<th class="'+(on?'sorted':'')+'" onclick="setSort(\''+col+'\')" style="cursor:pointer">'+label+' <span class="sort-icon">'+icon+'</span></th>';
}
function setSort(col){if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=-1;}renderTable();}

function renderHeatmap(){
  if(!filtered.length){document.getElementById('tabContent').innerHTML='<p class="empty">Няма данни.</p>';return;}
  const shopMap={};
  filtered.forEach(d=>{if(!shopMap[d.shop]||d.date>shopMap[d.shop].date) shopMap[d.shop]=d;});
  const shops=Object.values(shopMap).sort((a,b)=>(a.shop||'').localeCompare(b.shop||''));

  let h='<div class="heatmap-wrap"><table class="heatmap-table"><thead><tr><th>Магазин</th>';
  const fSecHMH=document.getElementById('fSector').value;
  SEC_IDS.forEach(sid=>{
    const sel=fSecHMH===sid?' style="color:#93C5FD;font-weight:900"':'';
    h+='<th'+sel+'>'+SEC_NAMES[sid]+(fSecHMH===sid?' ▼':'')+'</th>';
  });
  h+='<th>Обща %</th></tr></thead><tbody>';
  shops.forEach(d=>{
    h+='<tr><td>'+d.shop+'</td>';
    const fSecHM=document.getElementById('fSector').value;
    SEC_IDS.forEach(sid=>{
      const p=d.sectors&&d.sectors[sid]!==null?d.sectors[sid]:null;
      const cls=p===null?'hm-null':p>=85?'hm-great':p>=70?'hm-ok':p>=50?'hm-warn':'hm-bad';
      const highlight=fSecHM===sid?'outline:3px solid #fff;outline-offset:-3px;':'';
      h+='<td class="'+cls+'" style="'+highlight+'">'+(p!==null?p+'%':'—')+'</td>';
    });
    const op=d.overallPct;
    const oc=op===null?'hm-null':op>=85?'hm-great':op>=70?'hm-ok':op>=50?'hm-warn':'hm-bad';
    h+='<td class="'+oc+'" style="font-size:13px">'+(op!==null?op+'%':'—')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;font-size:11px;padding:4px 0"><span>Легенда:</span>'
    +'<span class="td-badge" style="background:#0A7C59;color:#fff">≥85%</span>'
    +'<span class="td-badge" style="background:#34D399;color:#065F46">70–85%</span>'
    +'<span class="td-badge" style="background:#FCD34D;color:#78350F">50–70%</span>'
    +'<span class="td-badge" style="background:#F87171;color:#7F1D1D">&lt;50%</span></div>';
  document.getElementById('tabContent').innerHTML=h;
}

function renderTrend(){
  if(!filtered.length){document.getElementById('tabContent').innerHTML='<p class="empty">Няма данни.</p>';return;}
  const fShop=document.getElementById('fShop').value;
  const fSec=document.getElementById('fSector').value;
  const sorted=[...filtered].sort((a,b)=>a.date>b.date?1:-1);
  let h='';

  if(fShop){
    h+='<div class="trend-card"><div class="trend-title">Тенденция — '+fShop+(fSec?' · '+SEC_NAMES[fSec]:'')+'</div><div class="trend-bars">';
    sorted.slice(-16).forEach(d=>{
      const pv=fSec?(d.sectors&&d.sectors[fSec]!==null?d.sectors[fSec]:null):d.overallPct;
      const bh=Math.max(3,(pv||0)*0.72);
      const col=pv===null?'#CBD5E1':pv>=85?'#0A7C59':pv>=60?'#D97706':'#C0392B';
      h+='<div class="tb-wrap"><div class="tb-pct" style="color:'+col+'">'+(pv!==null?pv+'%':'—')+'</div>'
        +'<div class="tb-bar" style="height:'+bh+'px;background:'+col+'"></div>'
        +'<div class="tb-label">'+fmtDate(d.date)+'</div></div>';
    });
    h+='</div></div>';
  } else {
    const shops=[...new Set(filtered.map(d=>d.shop))].sort();
    shops.slice(0,12).forEach(shop=>{
      const shopData=sorted.filter(d=>d.shop===shop).slice(-8);
      if(shopData.length<2) return;
      h+='<div class="trend-card"><div class="trend-title">'+shop+'</div><div class="trend-bars">';
      shopData.forEach(d=>{
        const pv=fSec?(d.sectors&&d.sectors[fSec]!==null?d.sectors[fSec]:null):d.overallPct;
        const bh=Math.max(3,(pv||0)*0.72);
        const col=pv===null?'#CBD5E1':pv>=85?'#0A7C59':pv>=60?'#D97706':'#C0392B';
        h+='<div class="tb-wrap"><div class="tb-pct" style="color:'+col+'">'+(pv!==null?pv+'%':'—')+'</div>'
          +'<div class="tb-bar" style="height:'+bh+'px;background:'+col+'"></div>'
          +'<div class="tb-label">'+fmtDate(d.date)+'</div></div>';
      });
      h+='</div></div>';
    });
  }
  document.getElementById('tabContent').innerHTML=h||'<p class="empty">Нужни са поне 2 проверки на магазин за тенденция.</p>';
}


// Форматира забележки — работи и за стар (s1_clean:) и за нов формат
function formatNotes(text) {
  if (!text || text === '-') return '';
  const SN = {
    s1:'1. Плочки и ламинат',s2:'2. Строителство',s3:'3. Баня и ВиК',
    s4:'4. Текстил',s5:'5. Подови настилки',s6:'6. Домашни потреби',
    s7:'7. Бои и облицовки',s8:'8. Ел. машини',s9:'9. Градина',
    s10:'10. Градин. мебели',s11:'11. Крепежи, обков и врати',s12:'12. Входна зона и фасада',
    s13:'13. Вътрешен склад',s14:'14. Външен склад',s15:'15. Плац',
    s16:'16. Касова зона и бюра',s17:'17. Осветление'
  };
  const GN = {
    clean:'Чистота & ред',labels:'Етикиране',arrange:'Подредба & изложба',
    pallet:'Палетна зона',corridor:'Коридори и визия',high:'Висока зона'
  };
  // Заменяме s1_clean: → 1. Плочки и ламинат → Чистота & ред:
  return text
    .replace(/s(\d+)_(clean|labels|arrange|pallet|corridor|high):/g, (m, n, k) =>
      (SN['s'+n]||'s'+n) + ' → ' + (GN[k]||k) + ':')
    // s1_1: → 1. Плочки и ламинат → критерий 1:
    .replace(/s(\d+)_(\d+):/g, (m, n, i) =>
      (SN['s'+n]||'s'+n) + ' → критерий ' + i + ':')
    // s1_1, s1_2 (в повторни грешки без двоеточие)
    .replace(/s(\d+)_(\d+)(?=[,\s]|$)/g, (m, n, i) =>
      (SN['s'+n]||'s'+n) + ' кр.' + i);
}

function renderNotes(){
  const withNotes=filtered.filter(d=>(d.notes&&d.notes!=='-')||(d.repeatIssues&&d.repeatIssues!=='-')||(d.deadlines&&d.deadlines!=='-'));
  if(!withNotes.length){document.getElementById('tabContent').innerHTML='<p class="empty">Няма коментари.</p>';return;}
  const sorted=[...withNotes].sort((a,b)=>b.date>a.date?1:-1);
  let h='<div style="font-size:11px;color:var(--slate);margin-bottom:10px">'+sorted.length+' проверки с коментари</div>';
  sorted.forEach(d=>{
    const hasRepeat=d.repeatIssues&&d.repeatIssues!=='-';
    h+='<div class="note-item'+(hasRepeat?' has-repeat':'')+'">'
      +'<div class="note-meta"><span class="note-shop">'+d.shop+'</span>'
      +'<span class="note-date">'+fmtDate(d.date)+'</span>'
      +(String(d.manager||'')?'<span style="font-size:11px;color:var(--slate)">'+String(d.manager||'')+'</span>':'')
      +'<span class="td-badge '+(d.bonusOk?'b-ok':'b-no')+'">'+( d.bonusOk?'✅':'✗')+'</span>'
      +(d.overallPct!==null?'<span class="td-mono" style="font-size:12px;color:'+pctColor(d.overallPct)+'">'+d.overallPct+'%</span>':'')
      +'</div>';
    if(d.notes&&d.notes!=='-') h+='<div class="note-text">📝 '+formatNotes(d.notes)+'</div>';
    if(hasRepeat) h+='<div class="note-repeat">🔁 Повторна грешка: '+formatNotes(d.repeatIssues)+'</div>';
    if(d.deadlines&&d.deadlines!=='-') h+='<div class="note-deadline">⏰ Срок: '+formatNotes(d.deadlines)+'</div>';
    h+='</div>';
  });
  document.getElementById('tabContent').innerHTML=h;
}

function renderChronic(){
  const fShop=document.getElementById('fShop').value;
  const counts={};
  filtered.forEach(d=>{
    SEC_IDS.forEach(sid=>{
      const p=d.sectors&&d.sectors[sid];
      if(p!==null&&p!==undefined&&p<85){
        const key=(fShop?'':d.shop+' · ')+SEC_NAMES[sid];
        counts[key]=(counts[key]||0)+1;
      }
    });
  });
  const items=Object.entries(counts).filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1]);
  if(!items.length){document.getElementById('tabContent').innerHTML='<p class="empty">Няма хронични проблеми (сектори под 85% в ≥2 проверки).</p>';return;}
  let h='<div style="font-size:11px;color:var(--slate);margin-bottom:10px">'+items.length+' хронични проблема</div>';
  items.forEach(([name,cnt])=>{
    const intensity=cnt>=5?'var(--red)':cnt>=3?'#EA580C':'#D97706';
    h+='<div class="chronic-item" style="border-left-color:'+intensity+'">'
      +'<span class="chronic-name">'+name+'</span>'
      +'<span class="chronic-cnt" style="color:'+intensity+'">'+cnt+'× под 85%</span>'
      +'</div>';
  });
  document.getElementById('tabContent').innerHTML=h;
}

function pctColor(p){
  if(p===null||p===undefined) return'var(--slate)';
  return p>=85?'var(--green)':p>=60?'#D97706':'var(--red)';
}
function fmtDate(d){
  if(!d) return '—';
  var s = String(d);
  // Ако е ISO timestamp (2026-05-11T21:00:00.000Z), конвертираме към локална дата
  if(s.length > 10 && s.indexOf('T') > 0) {
    var dt = new Date(s);
    return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  }
  return s.slice(0,10);
}
